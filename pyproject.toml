[project]
name = "promiseflow-ai"
version = "3.2.0"
description = "Finite-capacity production planning and delivery promise checks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.51.0",
    "ortools==9.15.6755",
    "openpyxl==3.1.5",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.3",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build"
