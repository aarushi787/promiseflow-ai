name: Application and PostgreSQL checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promiseflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promiseflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Local database regression tests
        run: python -m pytest -q
      - name: PostgreSQL integration and API tests
        env:
          PROMISEFLOW_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/promiseflow_test
        run: python -m pytest tests/test_database.py tests/test_api.py tests/test_execution.py tests/test_v3_decisions.py -q
      - run: npm ci --prefix frontend
      - run: npm run lint
      - run: npm run build
